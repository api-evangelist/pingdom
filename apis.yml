aid: pingdom
name: Pingdom
description: >-
  Pingdom is a website uptime and performance monitoring service from SolarWinds
  that tracks availability, response time, transactions, real user monitoring,
  and page speed from a global network of probe servers. It alerts teams via
  email, SMS, webhooks, and integrations when websites, APIs, or critical user
  journeys experience downtime or degraded performance. The Pingdom Public REST
  API (v3.1) provides programmatic access to checks, results, alerts, contacts,
  maintenance windows, and reports using Bearer token authentication.
